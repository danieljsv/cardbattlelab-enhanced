# Each push to main with a "feat:", "fix:" or "perf:" commit makes a release: the Android
# APK and the Chrome extension ZIP. See .github/scripts/release.mjs for the version rules.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the APK and the ZIP, but do not commit, tag or publish
        type: boolean
        default: true

# One run at a time: a queued run starts from the newest main and releases every commit
# since the last tag.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Plan
        id: plan
        run: |
          node .github/scripts/release.mjs plan > "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          next=$(node -p "JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/plan.json')).next ?? ''")
          if [ -z "$next" ] && [ "$DRY_RUN" = true ]; then
            next=$(node -p "require('./extension/manifest.json').version")
            echo "dry=true" >> "$GITHUB_OUTPUT"
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          [ -n "$next" ] || echo "::notice::No feat, fix or perf commit since the last release."

      - name: Tests
        if: steps.plan.outputs.next
        run: |
          python3 -m unittest discover -s tests
          node --test .github/scripts/*.test.mjs tests/*.test.mjs

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.plan.outputs.next
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.plan.outputs.next
        with:
          cache-provider: basic

      - name: Set version and changelog
        if: steps.plan.outputs.next && !steps.plan.outputs.dry
        run: |
          node .github/scripts/release.mjs apply "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/notes.md"
          git diff

      # Only this step gets the signing key, and it deletes the key file when it ends.
      - name: Build
        if: steps.plan.outputs.next
        env:
          CBL_BUILD_DIR: ${{ runner.temp }}/build
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Set the RELEASE_KEYSTORE_B64 and RELEASE_KEYSTORE_PASSWORD secrets."; exit 1
          fi
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$RELEASE_KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RELEASE_KEYSTORE_FILE"
          ./android/gradlew -p android assembleRelease --no-daemon --console=plain -q

      - name: Check the APK and the ZIP
        if: steps.plan.outputs.next
        env:
          NEXT: ${{ steps.plan.outputs.next }}
          # SHA-256 of the release key's certificate.
          RELEASE_CERT_SHA256: d8030ef4f90b616c8f321ac86f4d0d3f9c7981e0444a274b3dcfdb875294f161
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          bt=$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          badging=$("$bt/aapt" dump badging "$apk")
          grep -E "^package|^application-label:" <<<"$badging"
          grep -q "^package: name='com.daniel.cardbattlelab.enhanced' .*versionName='$NEXT'" <<<"$badging"
          certs=$("$bt/apksigner" verify --print-certs "$apk")
          cert=$(sed -nE 's/^.*certificate SHA-256 digest: ([0-9a-f]{64})$/\1/p' <<<"$certs" | head -1)
          if [ "$cert" != "$RELEASE_CERT_SHA256" ]; then
            echo "$certs"; echo "::error::The APK is not signed with the release key"; exit 1
          fi
          zip="$RUNNER_TEMP/build/cardbattlelab-enhanced-$NEXT.zip"
          unzip -l "$zip" | grep -q ' manifest.json$'
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/cardbattlelab-enhanced-$NEXT.apk"
          cp "$zip" "$RUNNER_TEMP/out/cardbattlelab-enhanced-$NEXT-chrome.zip"
          ls -l "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.next && env.DRY_RUN == 'true'
        with:
          name: release-dry-run
          path: ${{ runner.temp }}/out/

      - name: Commit, tag and publish
        if: steps.plan.outputs.next && env.DRY_RUN != 'true'
        env:
          NEXT: ${{ steps.plan.outputs.next }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Daniel Vieira"
          git config user.email "26206357+danieljsv@users.noreply.github.com"
          git add extension/manifest.json android/app/build.gradle CHANGELOG.md
          # The first release already has its version and changelog entry: tag it as it is.
          git diff --cached --quiet || git commit -m "Release $NEXT"
          git tag "v$NEXT"
          # Atomic: if main moved, both are rejected and the queued run releases everything.
          git push --atomic origin HEAD:main "refs/tags/v$NEXT"
          gh release create "v$NEXT" \
            "$RUNNER_TEMP/out/cardbattlelab-enhanced-$NEXT.apk" \
            "$RUNNER_TEMP/out/cardbattlelab-enhanced-$NEXT-chrome.zip" \
            --title "v$NEXT" --notes-file "$RUNNER_TEMP/notes.md"
