plugins { id 'com.android.application' }

def env = { String name -> System.getenv(name) ?: '' }
// Generated by tools/build.py: the overlay script and the launcher logo.
def generated = env('CBL_BUILD_DIR') ?: file('../../build').path

android {
    namespace 'com.daniel.cardbattlelab'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.daniel.cardbattlelab.enhanced'
        minSdk 26
        targetSdk 35
        versionCode 1000001
        versionName '1.0.1'
    }
    sourceSets {
        main.assets.srcDir "$generated/android-assets"
        main.res.srcDir "$generated/android-res"
    }
    signingConfigs {
        if (env('RELEASE_KEYSTORE_FILE')) release {
            storeFile file(env('RELEASE_KEYSTORE_FILE'))
            storePassword env('RELEASE_KEYSTORE_PASSWORD')
            keyAlias 'release'
            keyPassword env('RELEASE_KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Without the release key, a local release build uses the debug key.
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Android Studio and direct Gradle builds run the same build as build.sh.
tasks.register('prepareOverlay', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'tools/build.py', '--output-dir', generated
}
tasks.named('preBuild').configure { dependsOn 'prepareOverlay' }
